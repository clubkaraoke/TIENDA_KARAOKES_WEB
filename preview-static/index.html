<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TOP PERÚ · El Club Karaoke DJGABO</title>
  <style>
    :root{--bg:#f6f7f9;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--soft:#f3f4f6;--radius:14px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}.shell{max-width:1240px;margin:auto;padding:0 20px}.topbar{background:#111827;color:#fff}.topbar .shell{height:68px;display:flex;align-items:center;gap:24px}.brand{font-weight:800;letter-spacing:.02em}.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.16em;opacity:.65;margin-top:2px}.nav{margin-left:auto;display:flex;gap:22px;font-size:14px;align-items:center}.cart{padding:9px 13px;border-radius:999px;background:#fff;color:#111827;font-weight:700}.hero{background:linear-gradient(#eef0f4,#fff);border-bottom:1px solid var(--line)}.hero .shell{padding:46px 20px 34px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.17em;color:#6b7280;text-transform:uppercase}.hero h1{font-size:42px;line-height:1.05;max-width:760px;margin:8px 0 10px}.hero p{color:var(--muted);font-size:17px;max-width:760px}.search{margin-top:26px;display:flex;max-width:900px;background:white;border:1px solid #d1d5db;border-radius:15px;box-shadow:0 4px 18px rgba(0,0,0,.05);overflow:hidden}.search span{padding:0 0 0 18px;display:flex;align-items:center}.search input{width:100%;border:0;outline:0;padding:18px 16px;font-size:18px}.main{padding:28px 20px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}.table{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.head,.row{display:grid;grid-template-columns:74px minmax(220px,1.55fr) minmax(190px,1fr) 105px 140px;align-items:center}.head{background:#f9fafb;color:#6b7280;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}.head>div,.row>div{padding:13px 15px}.row{min-height:68px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row:hover{background:#fbfbfc}.play{width:42px;height:42px;border:1px solid #d1d5db;border-radius:50%;background:white;cursor:pointer;font-size:17px}.play:hover{background:#111827;color:#fff}.title{font-weight:760}.sub{font-size:12px;color:var(--muted);margin-top:4px}.artist{color:#374151}.price{font-weight:800}.add{border:0;border-radius:10px;padding:11px 13px;background:#111827;color:#fff;font-weight:800;cursor:not-allowed;opacity:.45}.pagination{display:flex;justify-content:center;gap:7px;margin-top:22px;flex-wrap:wrap}.pagination button{min-width:38px;height:38px;border:1px solid #d1d5db;border-radius:9px;background:#fff;cursor:pointer}.pagination button.active{background:#111827;color:#fff;border-color:#111827}.notice{margin:12px 0;padding:12px 14px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.dialog{width:min(980px,96vw);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.35)}.dialogbar{height:58px;padding:0 16px 0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-weight:800}.dialogbar button{margin-left:auto;border:0;width:36px;height:36px;border-radius:50%;background:#f3f4f6;cursor:pointer;font-size:20px}.player{width:100%;height:min(72vh,650px);border:0;background:#000}.empty{padding:50px;text-align:center;color:var(--muted)}.loading{padding:50px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.nav a{display:none}.hero h1{font-size:34px}.head{display:none}.row{grid-template-columns:58px 1fr 110px}.row .artistCell{grid-column:2}.row .priceCell{grid-column:3;grid-row:1}.row .addCell{grid-column:3;grid-row:2}.row>div{padding:10px}.artistCell{padding-top:0!important}.sub{display:none}.table{border-radius:10px}}
    @media(max-width:560px){.shell{padding-left:12px;padding-right:12px}.hero .shell{padding:30px 12px 24px}.hero h1{font-size:29px}.hero p{font-size:15px}.search input{font-size:16px;padding:15px 12px}.main{padding:18px 12px 48px}.row{grid-template-columns:54px 1fr 92px}.add{font-size:12px;padding:9px 8px}.player{height:62vh}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell"><div class="brand">DJGABO<small>EL CLUB KARAOKE</small></div><nav class="nav"><a>INICIO</a><a>NUEVOS</a><a>TOP</a><a>GÉNEROS</a><span class="cart">🛒 0</span></nav></div></header>
  <section class="hero"><div class="shell"><div class="eyebrow">TOP PERÚ · KARAOKES PERUANOS</div><h1>Encuentra tu karaoke y pruébalo al instante</h1><p>Busca por canción, artista, grupo o código. Mira un demo de 60 segundos sin salir del catálogo.</p><div class="search"><span>🔎</span><input id="q" placeholder="Busca canción, artista o grupo..." autocomplete="off" /></div></div></section>
  <main class="shell main"><div class="meta"><strong id="count">Cargando catálogo…</strong><span id="pageLabel"></span></div><div id="notice" class="notice"></div><section class="table"><div class="head"><div>Demo</div><div>Canción</div><div>Artista</div><div>Precio</div><div></div></div><div id="rows" class="loading">Cargando 2,890 karaokes…</div></section><div id="pages" class="pagination"></div></main>
  <div id="modal" class="modal"><div class="dialog"><div class="dialogbar"><span id="modalTitle">Demo</span><button id="close" aria-label="Cerrar">×</button></div><iframe id="player" class="player" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe></div></div>
<script>
const PAGE_SIZE=20; let songs=[], query='', page=1;
const $=s=>document.querySelector(s); const rows=$('#rows'), pages=$('#pages'), count=$('#count'), pageLabel=$('#pageLabel'), notice=$('#notice');
function norm(v=''){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9ñ]+/g,' ').trim()}
function filtered(){const terms=norm(query).split(/\s+/).filter(Boolean); if(!terms.length)return songs; return songs.filter(s=>{const h=norm([s.titulo,s.artista,s.marca,s.variante,s.anio,s.mes,s.id].join(' '));return terms.every(t=>h.includes(t))})}
function syncUrl(){const u=new URL(location.href); query?u.searchParams.set('q',query):u.searchParams.delete('q'); page>1?u.searchParams.set('page',page):u.searchParams.delete('page'); history.replaceState({},'',u)}
function render(){const list=filtered(); const total=Math.max(1,Math.ceil(list.length/PAGE_SIZE)); if(page>total)page=total; const visible=list.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE); count.textContent=`${list.length.toLocaleString('es-PE')} karaokes`; pageLabel.textContent=`Página ${page} de ${total}`; rows.className=''; rows.innerHTML=visible.length?visible.map(s=>`<div class="row"><div><button class="play" data-id="${s.id}" title="Ver demo">▶</button></div><div><div class="title">${esc(s.titulo)}</div><div class="sub">${esc(s.id)}${s.variante?` · ${esc(s.variante)}`:''}</div></div><div class="artistCell artist">${esc(s.artista)}</div><div class="priceCell price">—</div><div class="addCell"><button class="add" title="Se activará cuando aprobemos precios en Medusa">AGREGAR</button></div></div>`).join(''):'<div class="empty">No encontramos resultados.</div>';
  pages.innerHTML=''; const start=Math.max(1,Math.min(page-2,total-4)), end=Math.min(total,start+4); if(page>1)addPage('←',page-1); for(let p=Math.max(1,start);p<=end;p++)addPage(String(p),p,p===page); if(page<total)addPage('→',page+1); document.querySelectorAll('.play').forEach(b=>b.onclick=()=>openDemo(songs.find(x=>x.id===b.dataset.id))); syncUrl(); }
function addPage(label,p,active=false){const b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=()=>{page=p;render();scrollTo({top:document.querySelector('.main').offsetTop-10,behavior:'smooth'})};pages.appendChild(b)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(t){notice.textContent=t;notice.style.display='block'} function clearMsg(){notice.style.display='none';notice.textContent=''}
async function openDemo(song){if(!song)return; clearMsg(); const btn=document.querySelector(`.play[data-id="${song.id}"]`); const old=btn&&btn.textContent; if(btn){btn.textContent='…';btn.disabled=true} try{const r=await fetch('/api/store/demo/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_cancion:song.id})});if(!r.ok)throw new Error(`HTTP ${r.status}`);const s=await r.json();const audio=s.player&&s.player.audioUrl,cdg=s.player&&s.player.cdgUrl;if(!audio||!cdg)throw new Error('sin audio/cdg');const u=new URL('/top-peru-player/',location.origin);u.searchParams.set('audio',new URL(audio,location.origin));u.searchParams.set('cdg',new URL(cdg,location.origin));u.searchParams.set('title',`${song.artista} - ${song.titulo}`);u.searchParams.set('duration',String((s.player&&s.player.duration)||s.duration||60));u.searchParams.set('start',String((s.player&&s.player.start)||0));u.searchParams.set('autoplay',(s.player&&s.player.autoplay===false)?'0':'1';$('#modalTitle').textContent=`${song.artista} — ${song.titulo}`;$('#player').src=u;$('#modal').classList.add('open')}catch(e){msg(`No se pudo abrir el demo: ${e.message}`)}finally{if(btn){btn.textContent=old;btn.disabled=false}}}
function closeModal(){ $('#modal').classList.remove('open'); $('#player').src='about:blank'} $('#close').onclick=closeModal; $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}; addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const initial=new URLSearchParams(location.search);query=initial.get('q')||'';page=Math.max(1,Number(initial.get('page')||1)||1);$('#q').value=query;$('#q').oninput=e=>{query=e.target.value;page=1;render()};
fetch('data/catalogo-karaoke.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{songs=Array.isArray(d.items)?d.items:[];render()}).catch(e=>{rows.className='empty';rows.textContent='No se pudo cargar el catálogo TOP PERÚ.';msg(e.message)});
</script>
</body></html>
