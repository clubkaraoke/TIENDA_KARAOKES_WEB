name: OVH Secret Presence Temporary

on:
  push:
    branches:
      - integration/djgabo-tier-pricing-20260913
    paths:
      - '.github/workflows/ovh-secret-presence-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence only
        shell: bash
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in OVH_HOST OVH_PORT OVH_USER OVH_SSH_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=SET"
            else
              echo "${name}=NOT_SET"
            fi
          done
