name: DJGABO Five Track Provisioner CI Temporary

on:
  push:
    branches:
      - integration/djgabo-tier-pricing-20260913

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Install dependencies for verification only
        run: yarn install --non-interactive
      - name: Unit tests
        run: yarn test:unit --runTestsByPath src/lib/__tests__/djgabo-pricing.unit.spec.ts
      - name: Build backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          JWT_SECRET: ci-placeholder
          COOKIE_SECRET: ci-placeholder
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:7001
          AUTH_CORS: http://localhost:8000,http://localhost:7001
        run: yarn build
