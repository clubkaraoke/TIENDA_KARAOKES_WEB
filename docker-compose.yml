services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djgabo_karaoke_poc}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5433:5432"
    volumes:
      - djgabo_karaoke_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-djgabo_karaoke_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  djgabo_karaoke_pg:
